<main class="login-page">
  <section class="login-card">
    <h1>Kitchenstaff</h1>
    <h2>Connexion</h2>

    <div class="login-form">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="admin@kitchenstaff.test"
        [(ngModel)]="email"
      />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="Votre mot de passe"
        [(ngModel)]="password"
      />

      <button type="button" (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </div>

    <p class="error">
      {{ errorMessage }}
    </p>

    <p class="success">
      {{ successMessage }}
    </p>

    <p class="hint">
      Utilisez un compte ADMIN, CHEF ou COMMIS créé dans le backend.
    </p>
  </section>
</main>
