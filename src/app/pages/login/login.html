<main class="login-page">
  <section class="login-card">
    <h1>Kitchenstaff</h1>
    <h2>{{ i18n.t('login.title') }}</h2>

    @if (!isLoggedIn) {
      <div class="login-form">
        <label for="email">{{ i18n.t('login.email') }}</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="admin@kitchenstaff.test"
          [(ngModel)]="email"
        />

        <label for="password">{{ i18n.t('login.password') }}</label>
        <input
          id="password"
          type="password"
          name="password"
          [placeholder]="i18n.t('login.passwordPlaceholder')"
          [(ngModel)]="password"
        />

        <button type="button" (click)="onSubmit()" [disabled]="loading">
          {{ i18n.t(loading ? 'login.submitting' : 'login.submit') }}
        </button>
      </div>

      <p class="hint">
        {{ i18n.t('login.hint') }}
      </p>
    }

    @if (isLoggedIn) {
      <div class="session-box">
        <p>{{ i18n.t('login.signedInAs') }}</p>
        <h3>{{ userName }}</h3>
        <p>{{ i18n.t('login.role') }} {{ i18n.roleLabel(userRole) }}</p>

        <button type="button" class="logout-button" (click)="logout()">
          {{ i18n.t('login.logout') }}
        </button>
      </div>
    }

    <p class="error" role="alert">
      {{ errorMessage }}
    </p>

    <p class="success" role="status">
      {{ successMessage }}
    </p>
  </section>
</main>
