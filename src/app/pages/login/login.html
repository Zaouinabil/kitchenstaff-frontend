<main class="login-page">
  <section class="login-card">
    <h1>Kitchenstaff</h1>
    <h2>Connexion</h2>

    <form class="login-form">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="admin@kitchenstaff.test"
      />

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
      />

      <button type="button">Se connecter</button>
    </form>

    <p class="hint">
      Utilisez un compte ADMIN, CHEF ou COMMIS créé dans le backend.
    </p>
  </section>
</main>
